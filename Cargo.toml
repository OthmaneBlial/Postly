[workspace]
resolver = "2"
members = [
    "crates/postly-app",
    "crates/postly-core",
    "crates/postly-cli",
    "crates/postly-xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OthmaneBlial/Postly"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
cookie_store = { version = "0.22", default-features = true }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1.3"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "linux-native", "windows-native"] }
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
protox = "0.7"
quick-xml = { version = "0.41", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["charset", "cookies", "http2", "json", "multipart", "rustls-tls", "gzip", "brotli", "deflate", "socks", "stream", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.45", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tonic = { version = "0.13", default-features = false, features = ["codegen", "router", "transport", "tls-webpki-roots", "prost"] }
tonic-reflection = { version = "0.13.1", default-features = false }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.17", features = ["serde", "v4"] }
